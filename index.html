<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Switchgear Report Generator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.49.1/build/docxtemplater.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- Application Logic -->
  <script src="js/report-generator.js"></script>
  <script src="js/app.js"></script>
</head>
<body>

  <div class="card">
    <h2>Switchgear Test Report Generator</h2>
    <p>Upload your Excel workbook and select the reports you want to generate.</p>

    <div class="dropzone" id="dropArea">
      <span id="fileLabel">📁 Click to select or drop .xlsx/.xlsm file here</span>
      <input type="file" id="excelFile" accept=".xlsx,.xlsm" />
    </div>

    <div class="options-box">
      <div class="options-title">Reports to Generate</div>
      <div class="checkbox-grid">
        <label class="checkbox-label" id="lblMv">
          <input type="checkbox" id="chkMv" />
          MV Panel Report
        </label>
        <label class="checkbox-label" id="lblCt">
          <input type="checkbox" id="chkCt" />
          CT Report
        </label>
        <label class="checkbox-label" id="lblBbDlro">
          <input type="checkbox" id="chkBbDlro" />
          Busbar DLRO
        </label>
        <label class="checkbox-label" id="lblBbIr">
          <input type="checkbox" id="chkBbIr" />
          Busbar IR & HiPot
        </label>
        <label class="checkbox-label" id="lblVt">
          <input type="checkbox" id="chkVt" />
          VT Report
        </label>
      </div>
    </div>

    <button id="processBtn" disabled>Generate Selected Reports</button>
    <div id="log"></div>
  </div>

</body>
</html>
